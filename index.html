    <script>
      // Samonaprawa: jeśli przeglądarka trzyma stary HTML z nieaktualnymi
      // hashami plików (albo stary service worker), czyścimy cache i
      // przeładowujemy stronę raz z parametrem cache-bust.
      (function () {
        var KEY = 'szortsy_recovery_ts';

        // 1) Bezwarunkowo usuwamy każdego starego service workera (PWA cache
        //    potrafi serwować stary dokument HTML z martwymi assetami).
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
          }
        } catch (e) {}

        // 2) Natychmiastowa reakcja na błąd wczytania assetu (404 po deployu).
        window.addEventListener('error', function (ev) {
          var el = ev && ev.target;
          if (!el || !el.tagName) return;
          var url = el.href || el.src || '';
          if (url.indexOf(location.origin + '/assets/') !== 0) return;
          recover();
        }, true);

        function recover() {
          var last = 0;
          try { last = parseInt(sessionStorage.getItem(KEY) || '0', 10); } catch (e) {}
          if (Date.now() - last < 60000) return; // nie pętlimy
          try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}

          var done = function () {
            location.replace(location.pathname + location.search + (location.search ? '&' : '?') + '_r=' + Date.now());
          };
          var tasks = [];
          if (window.caches && caches.keys) {
            tasks.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          Promise.all(tasks).then(done, done);
        }

        window.addEventListener('load', function () {
          setTimeout(function () {

            var root = document.getElementById('root');
            var appMounted = !!(root && root.childElementCount > 0);
            var appStylesApplied = Array.prototype.some.call(document.styleSheets, function (sheet) {
              var href = sheet.href || '';
              if (href.indexOf(location.origin + '/assets/') === 0 && href.indexOf('.css') !== -1) return true;
              if (href.indexOf(location.origin + '/src/index.css') === 0) return true;
              var owner = sheet.ownerNode;
              return !!(owner && owner.tagName === 'STYLE' && owner.getAttribute('data-vite-dev-id'));
            });
            if (appMounted && appStylesApplied) {
              try { sessionStorage.removeItem(KEY); } catch (e) {}
              return;
            }
            recover();
          }, 4000);

        });
      })();
    </script>
